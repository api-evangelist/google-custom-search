  - Google
  - Image Search
  - Search
  - Web Search
apis:
  - name: Google Custom Search JSON API
    description: >-
      Enables programmatic web and image searches over websites or collections of websites using Programmable Search
      Engines, returning structured search results with metadata.
    humanURL: https://developers.google.com/custom-search/v1/overview
    baseURL: https://customsearch.googleapis.com
    tags:
